<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Async Weather Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>☀ Async Weather Tracker</h1>

    <div class="container">

        <div class="left">

            <h3>Search City</h3>

            <div class="search">
                <input type="text" id="cityInput" placeholder="Enter city name">
                <button onclick="getWeather()">Search</button>
            </div>

            <h3>Search History</h3>
            <div id="history"></div>

        </div>


        <div class="right">

            <h3>Weather Info</h3>

            <div id="weatherBox">

                <p>No data yet</p>

            </div>

        </div>

    </div>


    <div class="console">

        <h3>Console – Event Loop</h3>

        <pre id="consoleBox"></pre>

    </div>

    <script src="script.js"></script>

</body>

</html>
